<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" viewBox="0 0 1280 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ddb-architecture-title ddb-architecture-desc" id="d-01-architecture-root">
<title id="ddb-architecture-title">D&amp;D Beyond character sheet architecture</title>
<desc id="ddb-architecture-desc">Architecture of the D&amp;D Beyond character sheet: the React sheet UI dispatches actions to redux-saga handlers, which write raw server JSON into a six-slice Redux store and call three D&amp;D Beyond services through a Bearer-token API adapter, while 292 memoized rules-engine selectors turn the stored state into the values the UI renders.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-01-architecture-root { --paper: #f4f4f5; --surface: #ffffff; --ink: #18181b; --muted: #52525b; --soft: #71717a;
  --line: #e4e4e7; --accent: #9b2c2c; --link: #1d72ad;
  --font-sans: 'Geist', ui-sans-serif, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #d-01-architecture-root { font-family: var(--font-sans); color: var(--ink); }
      #d-01-architecture-root .lede { color: var(--muted); max-width: 76ch; margin-bottom: 1.75rem; font-size: 0.95rem; }
      #d-01-architecture-root .lede code, #d-01-architecture-root .card code, #d-01-architecture-root li code { font-family: var(--font-mono); font-size: 0.82em; color: var(--ink); }
      #d-01-architecture-root .diagram-container { width: 100%; overflow-x: auto; margin-bottom: 2rem; }
      #d-01-architecture-root.diagram { width: 100%; display: block; }
      #d-01-architecture-root .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
      #d-01-architecture-root .dot.ink { background: var(--ink); }
      #d-01-architecture-root .dot.accent { background: var(--accent); }
      #d-01-architecture-root .dot.soft { background: var(--soft); }
      #d-01-architecture-root nav.pager { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-family: var(--font-mono);
  font-size: 0.75rem; margin-bottom: 1.5rem; }
      #d-01-architecture-root nav.pager a { color: var(--accent); text-decoration: none; }
      #d-01-architecture-root nav.pager a:hover { text-decoration: underline; }
      #d-01-architecture-root .diagram-container { overflow-x: visible; }
      #d-01-architecture-root.diagram { min-width: 0 !important; }
      #d-01-architecture-root.diagram { min-width: 1280px; }
      #d-01-architecture-root.diagram { min-width: 0; }</style>
<marker id="d-01-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker>
<marker id="d-01-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9b2c2c"/></marker>
<marker id="d-01-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d72ad"/></marker>
