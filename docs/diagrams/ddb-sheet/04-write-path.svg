<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" viewBox="0 0 1280 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ddb-write-path-title ddb-write-path-desc" id="d-04-write-path-root">
<title id="ddb-write-path-title">Saving an edit on the D&amp;D Beyond sheet</title>
<desc id="ddb-write-path-desc">Sequence of an optimistic write: the sheet dispatches HIT_POINTS_SET, the commit saga opens a sync transaction and commits the change to the Redux store so selectors and the UI update first, then sends PUT life/hp/damage-taken; on success it closes the transaction, on an API error it closes it and calls the reject callback.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-04-write-path-root { --paper: #f4f4f5; --surface: #ffffff; --ink: #18181b; --muted: #52525b; --soft: #71717a;
  --line: #e4e4e7; --accent: #9b2c2c; --link: #1d72ad;
  --font-sans: 'Geist', ui-sans-serif, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #d-04-write-path-root { font-family: var(--font-sans); color: var(--ink); }
      #d-04-write-path-root .lede { color: var(--muted); max-width: 76ch; margin-bottom: 1.75rem; font-size: 0.95rem; }
      #d-04-write-path-root .lede code, #d-04-write-path-root .card code, #d-04-write-path-root li code { font-family: var(--font-mono); font-size: 0.82em; color: var(--ink); }
      #d-04-write-path-root .diagram-container { width: 100%; overflow-x: auto; margin-bottom: 2rem; }
      #d-04-write-path-root.diagram { width: 100%; display: block; }
      #d-04-write-path-root .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
      #d-04-write-path-root .dot.ink { background: var(--ink); }
      #d-04-write-path-root .dot.accent { background: var(--accent); }
      #d-04-write-path-root .dot.soft { background: var(--soft); }
      #d-04-write-path-root nav.pager { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-family: var(--font-mono);
  font-size: 0.75rem; margin-bottom: 1.5rem; }
      #d-04-write-path-root nav.pager a { color: var(--accent); text-decoration: none; }
      #d-04-write-path-root nav.pager a:hover { text-decoration: underline; }
      #d-04-write-path-root .diagram-container { overflow-x: visible; }
      #d-04-write-path-root.diagram { min-width: 0 !important; }
      #d-04-write-path-root.diagram { min-width: 1280px; }
      #d-04-write-path-root.diagram { min-width: 0; }</style>
<marker id="d-04-write-path-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker>
