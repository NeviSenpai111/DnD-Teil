<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" viewBox="0 0 1280 704" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ddb-load-sequence-title ddb-load-sequence-desc" id="d-02-load-sequence-root">
<title id="ddb-load-sequence-title">Loading a character in the D&amp;D Beyond sheet</title>
<desc id="ddb-load-sequence-desc">Sequence of the D&amp;D Beyond character load: the load saga gets a short-term token, fires four requests in parallel for the character, rule data, feature flags and vehicle rules, writes them into the Redux store, fetches mappings, infusion definitions and spell lists, and finally marks the store as loaded.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-02-load-sequence-root { --paper: #f4f4f5; --surface: #ffffff; --ink: #18181b; --muted: #52525b; --soft: #71717a;
  --line: #e4e4e7; --accent: #9b2c2c; --link: #1d72ad;
  --font-sans: 'Geist', ui-sans-serif, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #d-02-load-sequence-root { font-family: var(--font-sans); color: var(--ink); }
      #d-02-load-sequence-root .lede { color: var(--muted); max-width: 76ch; margin-bottom: 1.75rem; font-size: 0.95rem; }
      #d-02-load-sequence-root .lede code, #d-02-load-sequence-root .card code, #d-02-load-sequence-root li code { font-family: var(--font-mono); font-size: 0.82em; color: var(--ink); }
      #d-02-load-sequence-root .diagram-container { width: 100%; overflow-x: auto; margin-bottom: 2rem; }
      #d-02-load-sequence-root.diagram { width: 100%; display: block; }
      #d-02-load-sequence-root .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
      #d-02-load-sequence-root .dot.ink { background: var(--ink); }
      #d-02-load-sequence-root .dot.accent { background: var(--accent); }
      #d-02-load-sequence-root .dot.soft { background: var(--soft); }
      #d-02-load-sequence-root nav.pager { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-family: var(--font-mono);
  font-size: 0.75rem; margin-bottom: 1.5rem; }
      #d-02-load-sequence-root nav.pager a { color: var(--accent); text-decoration: none; }
      #d-02-load-sequence-root nav.pager a:hover { text-decoration: underline; }
      #d-02-load-sequence-root .diagram-container { overflow-x: visible; }
      #d-02-load-sequence-root.diagram { min-width: 0 !important; }
      #d-02-load-sequence-root.diagram { min-width: 1280px; }
      #d-02-load-sequence-root.diagram { min-width: 0; }</style>
<marker id="d-02-load-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker>
<marker id="d-02-load-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9b2c2c"/></marker>
<marker id="d-02-load-sequence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d72ad"/></marker>
