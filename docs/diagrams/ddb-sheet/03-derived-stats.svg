<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" viewBox="0 0 1280 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ddb-derived-stats-title ddb-derived-stats-desc" id="d-03-derived-stats-root">
<title id="ddb-derived-stats-title">How the sheet derives its numbers</title>
<desc id="ddb-derived-stats-desc">Data-flow graph of the D&amp;D Beyond rules engine: character JSON feeds modifier collectors and base ability scores, the collectors feed the global modifier hub read by 49 selectors, the hub and rule data feed abilities and proficiency, and those feed armor class, hit points and skills.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-03-derived-stats-root { --paper: #f4f4f5; --surface: #ffffff; --ink: #18181b; --muted: #52525b; --soft: #71717a;
  --line: #e4e4e7; --accent: #9b2c2c; --link: #1d72ad;
  --font-sans: 'Geist', ui-sans-serif, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #d-03-derived-stats-root { font-family: var(--font-sans); color: var(--ink); }
      #d-03-derived-stats-root .lede { color: var(--muted); max-width: 76ch; margin-bottom: 1.75rem; font-size: 0.95rem; }
      #d-03-derived-stats-root .lede code, #d-03-derived-stats-root .card code, #d-03-derived-stats-root li code { font-family: var(--font-mono); font-size: 0.82em; color: var(--ink); }
      #d-03-derived-stats-root .diagram-container { width: 100%; overflow-x: auto; margin-bottom: 2rem; }
      #d-03-derived-stats-root.diagram { width: 100%; display: block; }
      #d-03-derived-stats-root .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
      #d-03-derived-stats-root .dot.ink { background: var(--ink); }
      #d-03-derived-stats-root .dot.accent { background: var(--accent); }
      #d-03-derived-stats-root .dot.soft { background: var(--soft); }
      #d-03-derived-stats-root nav.pager { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-family: var(--font-mono);
  font-size: 0.75rem; margin-bottom: 1.5rem; }
      #d-03-derived-stats-root nav.pager a { color: var(--accent); text-decoration: none; }
      #d-03-derived-stats-root nav.pager a:hover { text-decoration: underline; }
      #d-03-derived-stats-root .diagram-container { overflow-x: visible; }
      #d-03-derived-stats-root.diagram { min-width: 0 !important; }
      #d-03-derived-stats-root.diagram { min-width: 1280px; }
      #d-03-derived-stats-root.diagram { min-width: 0; }</style>
<marker id="d-03-derived-stats-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker>
<marker id="d-03-derived-stats-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9b2c2c"/></marker>
<marker id="d-03-derived-stats-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d72ad"/></marker>
</defs>
