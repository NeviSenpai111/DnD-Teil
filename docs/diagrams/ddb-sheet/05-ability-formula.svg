<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" viewBox="0 0 1040 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ddb-ability-formula-title ddb-ability-formula-desc" id="d-05-ability-formula-root">
<title id="ddb-ability-formula-title">How one ability score is totalled</title>
<desc id="ddb-ability-formula-desc">Flowchart of D&amp;D Beyond&#x27;s ability-score total: base score plus racial, class and misc bonuses capped at 20 plus maximum bonuses, then the uncapped other bonus, a floor from set-score modifiers, an optional override, an optional stacking bonus, and a final clamp and modifier lookup, with Adrien Caine&#x27;s INT as a worked example ending at 19 (+4).</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-05-ability-formula-root { --paper: #f4f4f5; --surface: #ffffff; --ink: #18181b; --muted: #52525b; --soft: #71717a;
  --line: #e4e4e7; --accent: #9b2c2c; --link: #1d72ad;
  --font-sans: 'Geist', ui-sans-serif, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #d-05-ability-formula-root { font-family: var(--font-sans); color: var(--ink); }
      #d-05-ability-formula-root .lede { color: var(--muted); max-width: 76ch; margin-bottom: 1.75rem; font-size: 0.95rem; }
      #d-05-ability-formula-root .lede code, #d-05-ability-formula-root .card code, #d-05-ability-formula-root li code { font-family: var(--font-mono); font-size: 0.82em; color: var(--ink); }
      #d-05-ability-formula-root .diagram-container { width: 100%; overflow-x: auto; margin-bottom: 2rem; }
      #d-05-ability-formula-root.diagram { width: 100%; display: block; }
      #d-05-ability-formula-root .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
      #d-05-ability-formula-root .dot.ink { background: var(--ink); }
      #d-05-ability-formula-root .dot.accent { background: var(--accent); }
      #d-05-ability-formula-root .dot.soft { background: var(--soft); }
      #d-05-ability-formula-root nav.pager { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-family: var(--font-mono);
  font-size: 0.75rem; margin-bottom: 1.5rem; }
      #d-05-ability-formula-root nav.pager a { color: var(--accent); text-decoration: none; }
      #d-05-ability-formula-root nav.pager a:hover { text-decoration: underline; }
      #d-05-ability-formula-root .diagram-container { overflow-x: visible; }
      #d-05-ability-formula-root.diagram { min-width: 0 !important; }
      #d-05-ability-formula-root.diagram { min-width: 1040px; }
      #d-05-ability-formula-root.diagram { min-width: 0; }</style>
<marker id="d-05-ability-formula-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker>
<marker id="d-05-ability-formula-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9b2c2c"/></marker>
<marker id="d-05-ability-formula-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d72ad"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f4f4f5"/>
<line x1="320" y1="96" x2="320" y2="128" stroke="#52525b" stroke-width="1.2" marker-end="url(#d-05-ability-formula-arrow)"/>
<line x1="320" y1="184" x2="320" y2="216" stroke="#52525b" stroke-width="1.2" marker-end="url(#d-05-ability-formula-arrow)"/>
<line x1="320" y1="272" x2="320" y2="304" stroke="#52525b" stroke-width="1.2" marker-end="url(#d-05-ability-formula-arrow)"/>
<line x1="320" y1="360" x2="320" y2="392" stroke="#52525b" stroke-width="1.2" marker-end="url(#d-05-ability-formula-arrow)"/>
<!-- override yes -->
<line x1="428" y1="440" x2="520" y2="440" stroke="#52525b" stroke-width="1.2" marker-end="url(#d-05-ability-formula-arrow)"/>
<!-- override no -->
<line x1="320" y1="488" x2="320" y2="516" stroke="#52525b" stroke-width="1.2" marker-end="url(#d-05-ability-formula-arrow)"/>
<!-- override rejoin -->
<path d="M 620,464 L 620,512 Q 620,520 612,520 L 324,520" fill="none" stroke="#52525b" stroke-width="1.2" marker-end="url(#d-05-ability-formula-arrow)"/>
<line x1="320" y1="524" x2="320" y2="552" stroke="#52525b" stroke-width="1.2" marker-end="url(#d-05-ability-formula-arrow)"/>
<!-- stacking yes -->
<line x1="428" y1="600" x2="520" y2="600" stroke="#52525b" stroke-width="1.2" marker-end="url(#d-05-ability-formula-arrow)"/>
<!-- stacking no -->
<line x1="320" y1="648" x2="320" y2="676" stroke="#52525b" stroke-width="1.2" marker-end="url(#d-05-ability-formula-arrow)"/>
<!-- stacking rejoin -->
<path d="M 620,624 L 620,672 Q 620,680 612,680 L 324,680" fill="none" stroke="#52525b" stroke-width="1.2" marker-end="url(#d-05-ability-formula-arrow)"/>
<!-- to result -->
<line x1="320" y1="684" x2="320" y2="712" stroke="#9b2c2c" stroke-width="1.4" marker-end="url(#d-05-ability-formula-arrow-accent)"/>
<rect x="458" y="420" width="32" height="12" rx="2" fill="#f4f4f5"/>
<text x="474" y="429" fill="#52525b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
<rect x="328" y="496" width="24" height="12" rx="2" fill="#f4f4f5"/>
<text x="340" y="505" fill="#52525b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
<rect x="458" y="580" width="32" height="12" rx="2" fill="#f4f4f5"/>
<text x="474" y="589" fill="#52525b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
<rect x="328" y="656" width="24" height="12" rx="2" fill="#f4f4f5"/>
<text x="340" y="665" fill="#52525b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
<rect x="200" y="48" width="240" height="48" rx="24" fill="#18181b" fill-opacity="0.03" stroke="#18181b" stroke-opacity="0.30" stroke-width="1"/>
<text x="320" y="69" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', ui-sans-serif, sans-serif" text-anchor="middle">Base score</text>
<text x="320" y="84" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">stats[id].value</text>
<rect x="180" y="128" width="280" height="56" rx="6" fill="#f4f4f5"/>
<rect x="180" y="128" width="280" height="56" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
<text x="320" y="160" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', ui-sans-serif, sans-serif" text-anchor="middle">Add bonuses, cap at max</text>
<text x="320" y="175" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">min(base + bonuses, 20 + max bonus)</text>
<rect x="180" y="216" width="280" height="56" rx="6" fill="#f4f4f5"/>
<rect x="180" y="216" width="280" height="56" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
<text x="320" y="248" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', ui-sans-serif, sans-serif" text-anchor="middle">Add the other bonus</text>
<text x="320" y="263" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">bonusStats · applied after the cap</text>
<rect x="180" y="304" width="280" height="56" rx="6" fill="#f4f4f5"/>
<rect x="180" y="304" width="280" height="56" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
<text x="320" y="336" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', ui-sans-serif, sans-serif" text-anchor="middle">Raise to the set score</text>
<text x="320" y="351" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">max(score, set score), at most 30</text>
<polygon points="320,392 428,440 320,488 212,440" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
<text x="320" y="440" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', ui-sans-serif, sans-serif" text-anchor="middle">Override set?</text>
<text x="320" y="455" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">overrideStats ≠ 0</text>
<rect x="520" y="416" width="200" height="48" rx="6" fill="#f4f4f5"/>
<rect x="520" y="416" width="200" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
<text x="620" y="444" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', ui-sans-serif, sans-serif" text-anchor="middle">Use the override</text>
<text x="620" y="459" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">replaces the score</text>
<circle cx="320" cy="520" r="4" fill="#18181b"/>
<polygon points="320,552 428,600 320,648 212,600" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
<text x="320" y="600" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', ui-sans-serif, sans-serif" text-anchor="middle">Stacking bonus?</text>
<text x="320" y="615" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">stacking-bonus mods</text>
<rect x="520" y="576" width="200" height="48" rx="6" fill="#f4f4f5"/>
<rect x="520" y="576" width="200" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
<text x="620" y="604" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', ui-sans-serif, sans-serif" text-anchor="middle">Add it, re-cap</text>
<text x="620" y="619" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">min(cap, score + bonus)</text>
<circle cx="320" cy="680" r="4" fill="#18181b"/>
<rect x="180" y="712" width="280" height="56" rx="28" fill="#9b2c2c" fill-opacity="0.08" stroke="#9b2c2c" stroke-width="1"/>
<text x="320" y="736" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', ui-sans-serif, sans-serif" text-anchor="middle">Total and modifier</text>
<text x="320" y="751" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">clamp 1 to 30 · statModifiers table</text>
<line x1="776" y1="40" x2="776" y2="776" stroke="#18181b" stroke-opacity="0.10" stroke-width="0.8"/>
<text x="800" y="32" fill="#52525b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">WORKED EXAMPLE · INT</text>
<text x="800" y="72" fill="#18181b" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">15</text>
<text x="800" y="86" fill="#71717a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Adrien&#x27;s base INT</text>
<text x="800" y="156" fill="#18181b" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">15 + 0 + 0 + 4 = 19</text>
<text x="800" y="170" fill="#71717a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">item +2 · feat +2 · cap 30</text>
<text x="800" y="244" fill="#18181b" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">19 + 0 = 19</text>
<text x="800" y="258" fill="#71717a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">no other bonus</text>
<text x="800" y="332" fill="#18181b" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">19</text>
<text x="800" y="346" fill="#71717a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">no set-score modifier</text>
<text x="800" y="444" fill="#18181b" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">no override</text>
<text x="800" y="604" fill="#18181b" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">no stacking bonus</text>
<text x="800" y="740" fill="#18181b" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace">19 → +4</text>
<text x="800" y="754" fill="#71717a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">same as the DDB sheet</text>
<line x1="40" y1="808" x2="1000" y2="808" stroke="#18181b" stroke-opacity="0.10" stroke-width="0.8"/>
<text x="40" y="824" fill="#52525b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="839" width="24" height="12" rx="6" fill="#18181b" fill-opacity="0.03" stroke="#18181b" stroke-opacity="0.30" stroke-width="1"/>
<text x="70" y="848" fill="#52525b" font-size="8.5" font-family="'Geist', ui-sans-serif, sans-serif">Start / end</text>
<rect x="158" y="840" width="14" height="10" rx="2" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
<text x="178" y="848" fill="#52525b" font-size="8.5" font-family="'Geist', ui-sans-serif, sans-serif">Step</text>
<polygon points="230,845 242,839 254,845 242,851" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
<text x="260" y="848" fill="#52525b" font-size="8.5" font-family="'Geist', ui-sans-serif, sans-serif">Decision</text>
<circle cx="337" cy="845" r="4" fill="#18181b"/>
<text x="348" y="848" fill="#52525b" font-size="8.5" font-family="'Geist', ui-sans-serif, sans-serif">Merge</text>
<line x1="405" y1="845" x2="433" y2="845" stroke="#9b2c2c" stroke-width="1.2" marker-end="url(#d-05-ability-formula-arrow-accent)"/>
<text x="441" y="848" fill="#52525b" font-size="8.5" font-family="'Geist', ui-sans-serif, sans-serif">Result</text>
</svg>
