<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sigil.svg" />
    <meta name="theme-color" content="#f4f4f5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5eTools Builder</title>
    <script>
      // Apply the saved colour scheme before first paint (see src/store/themeStore.ts).
      try {
        var root = document.documentElement;
        root.dataset.theme = localStorage.getItem("builder.scheme") || "codex";
        root.dataset.glass = localStorage.getItem("builder.glass") || "on";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
